name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ../shared/api.env
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8080}:8080'
    volumes:
      - '${API_RUNTIME_HOST_PATH:?API_RUNTIME_HOST_PATH is required}:${API_RUNTIME_CONTAINER_PATH:?API_RUNTIME_CONTAINER_PATH is required}'
    networks:
      default:
        aliases:
          - cd-api
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:?WEB_HOST_PORT is required}:80'
    volumes:
      - ../frontend/current:/usr/share/nginx/html:ro
      - '${WEB_VIDEOS_HOST_PATH:?WEB_VIDEOS_HOST_PATH is required}:/usr/share/nginx/html/assets/videos:ro'
      - ./nginx/container.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

networks:
  default:
    name: ${API_NETWORK_NAME:?API_NETWORK_NAME is required}
    external: ${API_NETWORK_EXTERNAL:-false}
