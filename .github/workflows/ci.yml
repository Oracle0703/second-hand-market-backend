name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Catches stray sources that break compilation, e.g. cloud-sync "foo 2.go"
      # copies, which `go test` alone would not report clearly.
      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        # Miniapp publication acceptance is intentionally outside the API and
        # React CD scope; its contract test remains available for manual runs.
        run: go test ./... -skip '^TestMiniappAuthRefreshAcceptance'

  backend-image:
    name: backend (container build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies the production image, including vips/libheif runtime packages,
      # can be assembled before a successful main build is eligible for CD.
      - name: docker build
        run: docker build -f backend/Dockerfile -t second-hand-market-api:ci .

      - name: Deployment handover and rollback integration
        run: python3 deploy/app-server/tests/handover_test.py

  frontend:
    name: frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: vitest
        working-directory: frontend
        run: npm run test

      # `npm run build` is `tsc -b && vite build`, so this is the type check too.
      - name: build
        working-directory: frontend
        run: npm run build

  p1-mysql:
    name: P1 inventory concurrency (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: p1-ci-only
          MYSQL_DATABASE: p1_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pp1-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Exercise stock and administrator password concurrency
        working-directory: backend
        env:
          P1_MYSQL_DSN: root:p1-ci-only@tcp(127.0.0.1:3306)/p1_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -race ./internal/app -run '^TestP1MySQL' -count=1 -timeout=180s

  buyer-intent-mysql:
    name: buyer intent history (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: intent-ci-only
          MYSQL_DATABASE: buyer_intent_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintent-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Exercise migration, history, and concurrent requests
        working-directory: backend
        env:
          BUYER_INTENT_MYSQL_TEST: '1'
          BUYER_INTENT_MYSQL_DSN: root:intent-ci-only@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/buyer_intent_ci?parseTime=true&loc=UTC&timeout=5s&readTimeout=10s&writeTimeout=10s
        run: go test -race ./internal/app -run '^TestBuyerIntentMySQL' -count=1 -timeout=180s -v

  browser-flow:
    name: browser (admin security + merchant flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real browser and isolated API
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
